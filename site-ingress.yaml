apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: my-website-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: my-website.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: my-website-service
                port:
                  number: 80