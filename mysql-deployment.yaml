apiVersion: apps/v1
kind: Deployment

metadata:
  name: mysql

spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql


  template:
    metadata:
      labels:
        app: mysql
  
    spec:
      containers:
        - image: mysql:8.4.0
          name: mysql
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: my-password
          ports:
          - containerPort: 3306
            name: mysql