apiVersion: apps/v1
kind: Deployment

metadata:
  name: mysql

spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  strategy:
    type: Recreate

  template:
    metadata:
      labels:
        app: mysql
  
    spec:
      containers:
        - image: mysql:8.4.0
          name: mysql
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: my-website-secret
                  key: MYSQL_PASSWORD
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: my-website-configmap
                  key: MYSQL_DB
          ports:
          - containerPort: 3306
            name: mysql